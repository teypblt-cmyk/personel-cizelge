 leaves.forEach(function(l){if((l.type!=='I'&&l.type!=='M')||!uses[l.staff_id])return;var n=dnumS(l.day);uses[l.staff_id][wdN(n)].push(wkN(n))});

  var cnt={},hs={},m=0;
  staff.forEach(function(x){var h=uses[x.id][d].filter(function(w){return w<wk0}).sort(function(a,b){return b-a});cnt[x.id]=h.length;hs[x.id]=h;if(h.length>m&&!top(x))m=h.length});

   var ks=[];staff.forEach(function(q){if(!top(q)&&cnt[q.id]===cnt[x.id]&&!ks.some(function(k){return cmpH(k,hs[q.id])===0}))ks.push(hs[q.id])});
   ks.sort(cmpH);var r=0;for(var t=0;t<ks.length;t++)if(cmpH(ks[t],hs[x.id])===0){r=t;break}

  req.sort(function(a,b){return (pct[b.staff_id][i]-pct[a.staff_id][i])||(tsN(a.created_at)-tsN(b.created_at))||nm(a).localeCompare(nm(b),'tr')});

 for(var w=0;w<S.w.length;w++){
  var M=dnumS(isoD(w,0)),hf=izinHafta(staff,leaves,rules,M);
  hf.forEach(function(g,d){
   g.fixed.concat(g.ok).forEach(function(l){
    var t=RMT[l.type];if(!t)return;
    var nmx=null;staff.forEach(function(x){if(x.id===l.staff_id)nmx=x.name});
    if(l.staff_id===nilId&&nilId){want['n|'+g.ds]=t;return}

 Object.keys(keys).forEach(function(k){
  var r=want[k]||'',old=S.ri[k]||'',a=k.split('|'),cur;
  if(a[0]==='n'){if(!S.nl)S.nl={};cur=S.nl[a[1]]||''}
  else{var rw=S.w[+a[0]];if(!rw||!rw[+a[1]])return;cur=rw[+a[1]][+a[2]]}

  if(r){nu=r;if(S.ri[k]!==r){S.ri[k]=r;ch=true}}
  else if(old){if(cur===old)nu='';delete S.ri[k];ch=true}
  if(nu!==cur){ch=true;if(a[0]==='n'){if(nu)S.nl[a[1]]=nu;else delete S.nl[a[1]]}else S.w[+a[0]][+a[1]][+a[2]]=nu}});
 return ch}
